apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: leetalgo-api:BUILD_TAG
          imagePullPolicy: Never
          env:
            - name: ConnectionStrings__LeetAlgo
              valueFrom:
                secretKeyRef:
                  name: leetalgo
                  key: sql-connection
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: leetalgo
                  key: jwt-key
            - name: Database__MigrateOnStartup
              value: "false"
            - name: RateLimiting__AtGateway
              value: "true"
          readinessProbe:
            httpGet: {path: /health/ready, port: 8080}
            timeoutSeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: 8080}
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: web
  ports:
    - port: 80
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: leetalgo-web:BUILD_TAG
          imagePullPolicy: Never
          readinessProbe:
            httpGet: {path: /, port: 80}
          volumeMounts:
            - name: gateway
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: gateway
          configMap:
            name: gateway
