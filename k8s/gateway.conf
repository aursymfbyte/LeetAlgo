map $request_method $visit_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=search:1m rate=1r/s;
limit_req_zone $visit_key zone=visits:1m rate=1r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    limit_req_status 429;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;

    location ~* ^/api/auth/login/?$ {
        limit_req zone=login burst=4 nodelay;
        proxy_pass http://api:8080;
    }
    location ~* ^/api/search(/v2)?/?$ {
        limit_req zone=search burst=59 nodelay;
        proxy_pass http://api:8080;
    }
    location ~* ^/api/visits/?$ {
        limit_req zone=visits burst=59 nodelay;
        proxy_pass http://api:8080;
    }
    location /api/ {
        proxy_pass http://api:8080;
    }
    location /health/ {
        proxy_pass http://api:8080;
    }
}
