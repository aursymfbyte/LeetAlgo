services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 30

  tools:
    build:
      context: backend
      target: tools
    command: ["import", "/data"]
    environment:
      ConnectionStrings__LeetAlgo: Server=db;Database=LeetAlgo;User Id=sa;TrustServerCertificate=True
      Database__Password: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: backend
      target: api
    ports:
      - "8090:8080"
    environment:
      ConnectionStrings__LeetAlgo: Server=db;Database=LeetAlgo;User Id=sa;TrustServerCertificate=True
      Database__Password: ${DB_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      AllowedOrigins__0: http://localhost:8081
    depends_on:
      tools:
        condition: service_completed_successfully

  web:
    build:
      context: frontend
      args:
        VITE_API_URL: http://localhost:8090
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  db-data:
